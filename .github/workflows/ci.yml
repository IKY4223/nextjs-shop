name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # no database in CI: build and tests use the mock catalog (src/lib/catalog/source.ts)
    env:
      CATALOG_SOURCE: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # prisma 7 format has no --check flag: format, then fail if the schema changed
      - run: npx prisma format && git diff --exit-code prisma/
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      # next build also type-checks (it generates route types like LayoutProps first)
      - run: npm run build
